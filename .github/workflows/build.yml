name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'external/DotReticulum'
      - '.gitmodules'
      - 'DotReticulum.Ecosystem.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - '*NuGet*.Config'
      - 'global.json'
      - '.editorconfig'
      - 'PSScriptAnalyzerSettings.psd1'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'external/DotReticulum'
      - '.gitmodules'
      - 'DotReticulum.Ecosystem.slnx'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - '*NuGet*.Config'
      - 'global.json'
      - '.editorconfig'
      - 'PSScriptAnalyzerSettings.psd1'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NBGV_SetCloudBuildVersionVars: 'false'

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout producing commit and pinned stack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y clang zlib1g-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and build portable managed test artifacts
        run: |
          dotnet restore DotReticulum.Ecosystem.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DotReticulum.Ecosystem.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/New-TestBuild.ps1 -Directory artifacts/managed -Rid '${{ matrix.rid }}' -Commit (git rev-parse HEAD)

      - name: Publish and verify native applications
        run: ./tests/publish-ci-native.ps1 -Rid '${{ matrix.rid }}' -Commit (git rev-parse HEAD)

      - name: Upload native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/native/
            !artifacts/native/**/*.pdb
            !artifacts/native/**/*.dbg
            !artifacts/native/**/*.dSYM/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload managed test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-${{ matrix.rid }}
          path: |
            artifacts/managed/managed.tar
            artifacts/managed/managed-manifest.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  attest:
    name: Attest trusted Build artifacts
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download this Build's artifacts without executing them
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Attest native manifests and portable managed builds
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/native-*/build-manifest.json
            artifacts/managed-*/managed*
