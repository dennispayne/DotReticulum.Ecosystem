name: Release

# Tag-driven executable releases, or manual packaging without publication.
on:
  push:
    tags:
      - 'telemetry-v[0-9]+.[0-9]+.[0-9]+'
      - 'lxmd-v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - 'rnphone-v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      application:
        description: Executable to package
        type: choice
        options:
          - telemetry
          - lxmd
          - rnphone
        default: telemetry

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select executable
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.select.outputs.application }}
      project: ${{ steps.select.outputs.project }}
      package: ${{ steps.select.outputs.package }}
      version: ${{ steps.select.outputs.version }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select release target
        id: select
        shell: pwsh
        env:
          REQUESTED_APPLICATION: ${{ inputs.application }}
        run: |
          $application = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^(telemetry|lxmd|rnphone)-v(\d+\.\d+\.\d+(?:\.\d+)?)$') {
              throw "Unexpected release tag $env:GITHUB_REF_NAME"
            }
            $Matches[1]
          } else {
            $env:REQUESTED_APPLICATION
          }
          $targets = @{
            telemetry = @{ Project = 'src/DotTelemetry/DotTelemetry.csproj'; Package = 'DotTelemetry' }
            lxmd = @{ Project = 'src/lxmd/lxmd.csproj'; Package = 'lxmd' }
            rnphone = @{ Project = 'src/rnphone/rnphone.csproj'; Package = 'rnphone' }
          }
          if (!$targets.ContainsKey($application)) { throw "Unknown executable $application" }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace "^$application-v", ''
          } else {
            "dispatch-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          "application=$application" >> $env:GITHUB_OUTPUT
          "project=$($targets[$application].Project)" >> $env:GITHUB_OUTPUT
          "package=$($targets[$application].Package)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          $platforms = if ($application -eq 'rnphone') {
            @(
              @{ os = 'ubuntu-latest'; rid = 'linux-x64' }
              @{ os = 'windows-latest'; rid = 'win-x64' }
            )
          } else {
            @(
              @{ os = 'ubuntu-latest'; rid = 'linux-x64' }
              @{ os = 'windows-latest'; rid = 'win-x64' }
              @{ os = 'macos-latest'; rid = 'osx-arm64' }
            )
          }
          "matrix=$(@{ include = @($platforms) } | ConvertTo-Json -Compress -Depth 3)" >> $env:GITHUB_OUTPUT

  package:
    name: Package ${{ matrix.rid }}
    needs: select
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      RELEASE_APPLICATION: ${{ needs.select.outputs.application }}
      RELEASE_PROJECT: ${{ needs.select.outputs.project }}
      RELEASE_PACKAGE: ${{ needs.select.outputs.package }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Require a tagged commit on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME is not on main." }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y clang zlib1g-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Linux phone runtime dependencies
        if: needs.select.outputs.application == 'rnphone' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y libopus0 libcodec2-1.2 libopusfile0 libopusenc0 pulseaudio pulseaudio-utils
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows phone acceptance Opus dependency
        if: needs.select.outputs.application == 'rnphone' && runner.os == 'Windows'
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/xiph/opus.git artifacts/opus-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C artifacts/opus-source checkout --quiet 22244de5a79bd1d6d623c32e72bf1954b56235be
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S artifacts/opus-source -B artifacts/opus-build -A x64 -DBUILD_SHARED_LIBS=ON -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/opus-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        run: dotnet test DotReticulum.Ecosystem.slnx -c Release --logger trx --results-directory TestResults/release

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          $summary = & ./external/DotReticulum/tests/test_summary.ps1 -Path TestResults/release -Title 'Release tests (${{ matrix.rid }})'
          $summary
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Publish NativeAOT
        run: |
          $publish = @('publish', $env:RELEASE_PROJECT,
            '-c', 'Release', '-r', '${{ matrix.rid }}', '--self-contained', 'true',
            '-p:ILLinkTreatWarningsAsErrors=true', '-p:IlcTreatWarningsAsErrors=true',
            '-o', 'artifacts/native')
          if ($IsWindows) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
            $env:PATH = "$installer;$env:PATH"
            $installation = & (Join-Path $installer 'vswhere.exe') -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$installation) { throw 'MSVC NativeAOT tools are unavailable.' }
            $setup = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
            & $env:ComSpec /c "call `"$setup`" >nul && dotnet $($publish -join ' ')"
          } else {
            dotnet @publish
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the native binary
        run: |
          $exe = $env:RELEASE_APPLICATION + $(if ($IsWindows) { '.exe' } else { '' })
          $binary = Join-Path $PWD "artifacts/native/$exe"
          & $binary --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned Python delivery reference
        if: needs.select.outputs.application == 'lxmd'
        run: |
          python -m venv artifacts/reference-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $PWD $(if ($IsWindows) {
            'artifacts/reference-venv/Scripts/python.exe'
          } else {
            'artifacts/reference-venv/bin/python'
          })
          & $python -m pip install 'lxmf==1.2.1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --quiet --filter=blob:none --no-checkout https://github.com/markqvist/Reticulum.git artifacts/reference-rns
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C artifacts/reference-rns checkout --quiet a29bfb51c468945c96a1ee22cae0114e993e2391
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DOTRETICULUM_PYTHON=$python" >> $env:GITHUB_ENV
          "DOTRETICULUM_UPSTREAM=$(Join-Path $PWD 'artifacts/reference-rns')" >> $env:GITHUB_ENV
          'DOTRETICULUM_LIVE=1' >> $env:GITHUB_ENV

      - name: Install executable acceptance runner
        if: needs.select.outputs.application != 'telemetry'
        run: |
          & ./external/DotReticulum/tests/install-pester.ps1

      - name: Verify native delivery and restart
        if: needs.select.outputs.application == 'lxmd'
        run: |
          $exe = if ($IsWindows) { 'lxmd.exe' } else { 'lxmd' }
          $env:DOTRETICULUM_LXMD_BINARY = Join-Path $PWD "artifacts/native/$exe"
          & ./tests/run-pester.ps1 -Path ./tests/Pester/Lxmd.Tests.ps1 -Tag Native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native phone audio flow
        if: needs.select.outputs.application == 'rnphone'
        run: |
          $exe = if ($IsWindows) { 'rnphone.exe' } else { 'rnphone' }
          $env:DOTLXST_RNPHONE_BINARY = Join-Path $PWD "artifacts/native/$exe"
          if ($IsWindows) {
            # Acceptance-only dependency; packages require separately installed native libraries.
            Copy-Item artifacts/opus-build/Release/opus.dll artifacts/native/
            $env:DOTLXST_WINDOWS_AUDIO = '1'
            & ./tests/run-pester.ps1 -Path ./tests/Pester/Rnphone.Tests.ps1 -Tag NativeWindows
          } else {
            $env:DOTLXST_VIRTUAL_AUDIO = '1'
            & ./tests/run-pester.ps1 -Path ./tests/Pester/Rnphone.Tests.ps1 -Tag NativeStandalone
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage package and create zip
        run: |
          $name = "$env:RELEASE_PACKAGE-$env:RELEASE_VERSION-${{ matrix.rid }}"
          $exe = $env:RELEASE_APPLICATION + $(if ($IsWindows) { '.exe' } else { '' })
          New-Item -ItemType Directory -Path "artifacts/$name", artifacts/release | Out-Null
          Copy-Item "artifacts/native/$exe", LICENSE -Destination "artifacts/$name"
          if ($env:RELEASE_APPLICATION -eq 'rnphone') {
            Copy-Item docs/lxst.md -Destination "artifacts/$name"
          }
          $zip = Join-Path $PWD "artifacts/release/$name.zip"
          if ($IsWindows) {
            Compress-Archive -Path "artifacts/$name/*" -DestinationPath $zip
          } else {
            Push-Location "artifacts/$name"
            zip -r -y -q $zip .
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [select, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PACKAGE: ${{ needs.select.outputs.package }}
          RELEASE_VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -euo pipefail
          cat release/*.sha256 > release/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --verify-tag --title "$RELEASE_PACKAGE $RELEASE_VERSION" --generate-notes
